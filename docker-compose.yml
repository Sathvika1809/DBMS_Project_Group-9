services:
  postgres_db:
    image: postgres:16-alpine
    container_name: paper_trading_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: papertrading
    ports:
      - "5432:5432"
    volumes:
      # Init scripts run once, in filename order, on first start of an empty volume
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/02_views_indexes.sql:/docker-entrypoint-initdb.d/02_views_indexes.sql
      - ./db/03_triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql
      - ./db/04_procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql
      - ./db/05_seed_data.sql:/docker-entrypoint-initdb.d/05_seed_data.sql
      - ./data_pipeline/seed_csvs:/data_pipeline/seed_csvs:ro
    healthcheck:
      # -h localhost forces a TCP check. During first-time init Postgres runs a
      # temporary server on the Unix socket only, so a socket check can pass
      # before the seed has finished and the backend would start too early.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d papertrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: paper_trading_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: papertrading
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      postgres_db:
        condition: service_healthy