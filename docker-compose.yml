version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: paper_trading_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: papertrading
    ports:
      - "5432:5432"
    volumes:
      # Mount database DDL scripts to execute automatically on container startup
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/02_views_indexes.sql:/docker-entrypoint-initdb.d/02_views_indexes.sql
      - ./db/03_triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql
      - ./db/04_procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql
      # Mount seed scripts and CSV data pipeline
      - ./db/05_seed_data.sql:/docker-entrypoint-initdb.d/05_seed_data.sql
      - ./data_pipeline/seed_csvs:/data_pipeline/seed_csvs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papertrading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: paper_trading_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: papertrading
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      postgres_db:
        condition: service_healthy